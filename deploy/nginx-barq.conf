# كونفيج nginx للإنتاج — نسخة مرجعية لـ /etc/nginx/sites-enabled/barq
#
# ⚠️ ده مش بيتنشر تلقائي بأي سكريبت — لازم يترفع يدوي للسيرفر:
#   scp deploy/nginx-barq.conf root@138.199.220.217:/etc/nginx/sites-enabled/barq
#   ssh root@138.199.220.217 'nginx -t && systemctl reload nginx'
#
# ⚠️ مشروع مستقل تماماً عن Tafra ERP الشغّال على نفس السيرفر — الكونفيج ده بيتحط في
# ملف منفصل (`sites-enabled/barq`)، على مجلد مستقل (`/var/www/barq`)، بصفر تعارض مع كونفيج
# `sites-enabled/erp` الموجود بالفعل. راجع `deploy/DEPLOYMENT.md` للخطوات الكاملة.
#
# 🌐 دومين واحد بيغطي حالتين: `adamfoash.tafraos.com` بالظبط (لوحة التحكم) و
# `*.adamfoash.tafraos.com` (أي موقع اتولّد من مشروع، زي مشروع-تجريبي.adamfoash.tafraos.com).
# الفرق بينهم بيتحسم جوّه Laravel نفسه (`bootstrap/app.php` — راوتينج بالدومين)، مش هنا في
# nginx؛ الاتنين بيوصّلوا لنفس الـ docroot ونفس الـ PHP-FPM pool.
#
# ⚠️ الوايلد كارد `*.adamfoash.tafraos.com` محتاج تغطية SSL من Cloudflare عشان يشتغل
# على HTTPS من برّه — الشهادة المجانية العادية (Universal SSL) بتغطي مستوى واحد بس
# (`*.tafraos.com`)، مش مستوى تاني جواه. لازم تفعيل "Total TLS" (مجاني) من
# Cloudflare Dashboard → SSL/TLS → Edge Certificates عشان مواقع المشاريع المنشورة
# تشتغل على HTTPS. من غيره الدومين نفسه (adamfoash.tafraos.com) شغال عادي، بس أي
# موقع مشروع منشور (subdomain تاني جواه) هيدي خطأ SSL في المتصفح.
#
# 🔒 نفس دفاع الأمان الموجود في كونفيج الـ ERP: منع تنفيذ PHP جوّه مجلد الرفع العام.
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name adamfoash.tafraos.com *.adamfoash.tafraos.com;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # بنستخدم نفس شهادة Tafra ERP (Cloudflare Origin CA بتغطي *.tafraos.com) بدل
    # ما نطلب شهادة جديدة مخصوصة — كافية لأن الاتصال بين Cloudflare والسيرفر (origin)
    # في وضع Full SSL مش محتاج مطابقة اسم دومين صارمة زي Full (strict).
    ssl_certificate     /etc/ssl/tafra/tafra.crt;
    ssl_certificate_key /etc/ssl/tafra/tafra.key;

    root /var/www/barq/public;
    index index.php;
    charset utf-8;
    client_max_body_size 20M;

    location / { try_files $uri $uri/ /index.php?$query_string; }
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }
    error_page 404 /index.php;

    # 🔒 دفاع بالعمق ضد RCE: امنع تنفيذ أي PHP في مجلد رفع صور المواقع نهائياً
    # (GeneratedSiteController بيخزّن فيه صور اللوجو/الأقسام على disk('public')).
    # لازم قبل قاعدة \.php$ عشان تاخد الأولوية في مطابقة nginx.
    location ~* ^/storage/.*\.php$ { deny all; return 403; }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }
    location ~ /\.(?!well-known).* { deny all; }
}
